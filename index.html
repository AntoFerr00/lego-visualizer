<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lego Visualizer</title>
  <script type="module" crossorigin src="/lego-visualizer/assets/index-Beijelfo.js"></script>
  <link rel="stylesheet" crossorigin href="/lego-visualizer/assets/index-BhTO4nBi.css">
</head>

<body>
  <div id="app">
    <div id="ui">
      <h1>🧱 Lego Visualizer</h1>
      <div id="piece-panel">
        <h3>Piece Dimensions</h3>

        <div class="dimension-row">
          <label for="piece-width">Width:</label>
          <input type="number" id="piece-width" min="1" max="16" value="2">
        </div>

        <div class="dimension-row">
          <label for="piece-depth">Depth:</label>
          <input type="number" id="piece-depth" min="1" max="16" value="4">
        </div>

        <div class="dimension-row">
          <label for="piece-height">Height:</label>
          <input type="number" id="piece-height" min="1" max="50" value="3">
        </div>

        <div id="piece-preview-text">2 × 4 × 3</div>
      </div>
      <div id="controls">
        <button id="clear-btn">🗑️ Clear</button>
        <button id="delete-mode">✂️ Delete Brick</button>
        <button id="rotate-mode">🔄 Rotate</button>
        <div id="color-picker"></div>
      </div>
      <div id="instructions">
        <small>Click grid to place • Right-click to rotate • Drag to pan</small>
      </div>
    </div>
    <canvas id="canvas"></canvas>
  </div>
</body>

</html>
